output_dir: /home/example/Videos/

jobs:
  - drive: /dev/sr0
    disc_type: dvd # This can be omitted, as it defaults to dvd
    shows:
      - name: "Show"
        season: 1
        episode: 1
        title: 1
      - name: "Show"
        season: 1
        episode: 2
        title: 2
      - name: "Show"
        season: 1
        episode: 3
        title: 3
  - drive: /dev/sr1
    disc_type: bluray
    output_dir: /home/example/Movies
    movies:
      - name: "Movie"
        title: 1
  - drive: /dev/sr2
    disc_type: cd
    output_dir: /home/example/Music
    cds:
      - musicbrainz: ""
